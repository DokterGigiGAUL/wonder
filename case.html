<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Kasus</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/case.css"> </head>

<body>
    <header class="case-header">
        <button id="backBtn" class="tts-back-btn">
            <a href="https://doktergigigaul.github.io/wonder/index.html">
                <img src="https://img.icons8.com/?size=16&id=bb5otgOrCxAR&format=png&color=FFFFFF">
            </a>
        </button>
        <div class="case-title-box">
            <h2 id="caseTitle">Kartu Kasus</h2> </div>
    </header>
    <main class="case-container">
        <div class="case-wrapper">
            <!-- KARTU KASUS LAMA -->
            <div class="image-flip" id="imageFlip">
                <div class="image-face front">
                    <div class="case-image"> <img id="case-image" alt="Foto kasus"> </div>
                </div>
                <div class="image-face back">
                    <div class="case-image"> <img id="case-image-back" alt="Foto kasus"> </div>
                </div>
            </div>
            <div class="info-flip" id="infoFlip">
                <div class="info-face">
                    <div class="case-back-content">
                        <div class="patient" style="display:none;" id="patient"></div>
                        <div class="case-scroll">
                            <h3>Anamnesis</h3>
                            <p id="anamnesis"></p>
                            <h3>Pemeriksaan Klinis</h3>
                            <p id="clinicalExaminations"></p>
                        </div>
                    </div>
                    <div class="case-navigation">
                        <button id="" class="btn btn-outline prev-case"> ← Sebelumnya </button>
                        <button id="" class="btn btn-primary next-case"> Berikutnya → </button>
                    </div>
                </div>
                <!-- BACK -->
                <div class="info-face back">
                    <div class="case-back-content">
                        <div class="diagnosis-hero">
                            <div id="diagnosis" class="diagnosis-name"></div>
                        </div>
                        <div class="case-scroll">
                            <h3>Diagnosis Banding</h3>
                            <ul id="dd-list"></ul>
                            <h3>Deskripsi Lesi</h3>
                            <p id="lesion-description"></p>
                            <h3>Panduan Pemeriksaan Klinis</h3>
                            <ul id="clinical-list"></ul>
                            <div id="premium-section">
                                <div id="premium-banner"></div>
                                <section class="premium-item">
                                    <h3>Patofisiologi</h3>
                                    <p id="pathophysiology"></p>
                                </section>
                                <section class="premium-item">
                                    <h3>Pemeriksaan Penunjang</h3>
                                    <p id="supporting-examination"></p>
                                </section>
                                <section class="premium-item">
                                    <h3>Rencana Perawatan</h3>
                                    <p id="treatment-plan"></p>
                                </section>
                                <section class="premium-item">
                                    <h3>Follow Up</h3>
                                    <p id="follow-up"></p>
                                </section>
                                <section class="premium-item">
                                    <h3>Key Points</h3>
                                    <ul id="key-points"></ul>
                                </section>
                            </div>
                        </div>
                    </div>
                    <div class="case-navigation">
                        <button id="" class="btn btn-outline prev-case"> ← Sebelumnya </button>
                        <button id="" class="btn btn-primary next-case"> Berikutnya → </button>
                    </div>
                </div>
            </div>
        </div>
    </main>


    <script src="js/case-data.js"></script>
    <script src="js/case.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Penyakit Mulut</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/quiz.css">
</head>

<body>

<header class="quiz-header">

    <button id="backBtn" class="quiz-back-btn"><img src="https://img.icons8.com/?size=16&id=bb5otgOrCxAR&format=png&color=FFFFFF"></button>

    <div class="quiz-title-box">
        <h2 id="quizTitle">Kuis</h2>
        <p id="questionCounter">Soal 1 dari 10</p>
    </div>

    <div id="timer" class="timer">
        10:00
    </div>

</header>

<main class="quiz-container">

    <div id="premiumLock" class="question-card premium-lock" style="display:none;">
        <h3>Kuis Premium</h3>
        <p id="premiumLockPrice"></p>
        <div class="navigation">
            <a href="index.html" class="btn btn-outline nav-btn">
                Kembali ke Beranda
            </a>
            <a id="premiumLockBtn" class="btn btn-primary nav-btn" target="_blank" rel="noopener noreferrer">
                Beli Sekarang
            </a>
        </div>
    </div>

    <div id="progressWrapper" class="progress">

        <div id="progressBar" class="progress-bar"></div>

    </div>

    <div id="questionCard" class="question-card">

        <img
            id="questionImage"
            class="question-image"
            src=""
            alt="Gambar Soal"
        >

        <h3 id="questionText"></h3>

        <div id="choices" class="choices"></div>

    </div>

    <div id="quizNavigation" class="navigation">

        <button id="prevBtn" class="btn btn-outline nav-btn">
            Sebelumnya
        </button>

        <button id="nextBtn" class="btn btn-primary nav-btn">
            Selanjutnya
        </button>

    </div>

</main>
<script src="js/quiz-data.js"></script>
<script src="js/storage.js"></script>
<script src="js/timer.js"></script>
<script src="js/quiz.js"></script>

</body>
</html>

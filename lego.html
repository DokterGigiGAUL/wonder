<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dentabrix Lego</title>
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/lego.css">
</head>

<body>
<header class="ebook-header">
    <button id="legoBackBtn" class="ebook-back-btn">
        <img src="https://img.icons8.com/?size=16&id=bb5otgOrCxAR&format=png&color=FFFFFF">
    </button>
    <div class="ebook-title-box">
        <h2>Dentabrix Lego</h2>
    </div>
</header>

<main class="container">
    <section class="ebook-preview">
        <div id="preview-slider" class="preview-slider"></div>
        <div id="preview-dots" class="preview-dots"></div>
    </section>

    <section class="ebook-info">
        <h2 id="lego-title"></h2>
        <p id="lego-price" class="ebook-price"></p>
        <div class="ebook-action">
            <a id="buyButton" class="btn btn-primary iframe-lightbox-link">
                Beli Sekarang
            </a>
        </div>
    </section>

    <section class="ebook-description">
        <h3>Deskripsi</h3>
        <p id="lego-description"></p>
        <div class="ebook-consent">
            DISCLAIMER: Produk ini merupakan barang fisik. Pengiriman dilakukan setelah pembayaran berhasil dikonfirmasi.
        </div>
    </section>

    <section class="ebook-payment">
        <h3>Metode Pembayaran</h3>
        <img src="assets/images/metode-bayar.webp" alt="Metode Pembayaran">
    </section>
</main>

<script src="js/lego-data.js"></script>
<script src="js/lego.js"></script>
<script src="https://mayarembed.r2.mayar.id/mayar-new-min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tebak Kartu Gigi</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#999;--ok:#1a8f4a;--bad:#c0392b;--bt:#0076DF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--fg:#f2f2f2;--mut:#8a9099;--ok:#4cd68a;--bad:#ff7a6b}}
:root[data-theme="dark"]{--bg:#15181c;--fg:#f2f2f2;--mut:#8a9099;--ok:#4cd68a;--bad:#ff7a6b}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:Verdana,Geneva,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{max-width:660px;margin:0 auto;padding:16px 12px 24px}
#score{text-align:right;color:var(--mut);font-size:clamp(15px,4vw,26px);margin-bottom: clamp(24px, 2vw, 48px)}
#stage{position:relative;width:100%}
.card{position:absolute;left:0;top:0;z-index:1;perspective:900px;will-change:transform}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s ease}
.inner.down{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face svg{display:block;width:100%;height:100%;overflow:visible}
#msg{text-align:center;font-weight:bold;font-size:clamp(18px,6vw,28px);line-height:1.15;margin-top:16px}
#msg.ok{color:var(--ok)}#msg.bad{color:var(--bad)}
#sub{text-align:center;color:var(--mut);font-size:clamp(13px,3.4vw,18px);margin: 8px auto 24px;min-height:1.3em}
#btns{display:flex;flex-direction:column;gap:12px;max-width:340px;margin:16px auto 0}
.btn{
       -webkit-font-smoothing: antialiased;
       -moz-osx-font-smoothing: grayscale;
     font: clamp(18px, 4vw, 24px) -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 8px 16px;
    border-radius: 12px;
    border: 2px solid var(--bt);
    background: var(--bt);
    color: #fff;
    cursor: pointer;}
.btn.alt{background:transparent;color:var(--bt)}
.btn:active{transform:scale(.97)}
</style>
</head>
<body>
<div id="wrap">
  <div id="score">Menang = 0 | Kalah = 0</div>
  <div id="msg">Temukan kartu gigi sehat</div>
  <div id="sub">Perhatikan acakan kartunya, lalu pilih</div>

  <div id="stage"></div>
  <div id="btns"></div>
</div>
<script>
const P="M20 7 H180 Q190 7 190 17 V257 Q190 267 180 267 H20 Q10 267 10 257 V17 Q10 7 20 7 Z";
const IN="translate(100 137) scale(.89 .9) translate(-100 -137)";
const T="M50 22 C40 14 22 14 18 34 C15 50 24 58 26 74 C28 90 32 98 38 98 C45 98 44 80 50 80 C56 80 55 98 62 98 C68 98 72 90 74 74 C76 58 85 50 82 34 C78 14 60 14 50 22 Z";
function tooth(kind){
  if(kind==='good') return `<path d="${T}" fill="url(#tg)" stroke="#2b8fd0" stroke-width="4" stroke-linejoin="round"/><path d="M30 32 C32 24 40 22 44 26" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>`;
  return `<path d="${T}" fill="#e3cf94" stroke="#8a6d3b" stroke-width="4" stroke-linejoin="round"/><ellipse cx="50" cy="44" rx="12" ry="14" fill="#3b2414"/><ellipse cx="47" cy="40" rx="5" ry="6" fill="#5a3a20"/><circle cx="30" cy="60" r="4.5" fill="#6b4a25"/><circle cx="69" cy="56" r="3.5" fill="#6b4a25"/><circle cx="62" cy="72" r="3" fill="#6b4a25"/>`;
}
const STAR=`<path d="M0-10 L2.5-2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5-2.5Z" fill="#ffc83d"/>`;
const SHARED=`<defs>
<linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fafafa"/><stop offset="1" stop-color="#e2e2e2"/></linearGradient>
<linearGradient id="fold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".46" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#000" stop-opacity=".16"/><stop offset=".56" stop-color="#000" stop-opacity=".03"/><stop offset="1" stop-color="#000" stop-opacity=".1"/></linearGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d6ecfb"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a6db0"/><stop offset="1" stop-color="#12365e"/></linearGradient>
<pattern id="bp" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="11" height="11" fill="rgba(255,255,255,.13)"/></pattern>
<filter id="bl" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="3"/></filter></defs>`;
// bayangan: lapisan abu di bawah + blur; tepi putih tebal; muka kartu menekuk di tengah
const SHADOW=`<path d="M14 252 L186 252 Q100 296 14 252 Z" fill="#000" opacity=".42" filter="url(#bl)"/><rect x="16" y="258" width="168" height="10" rx="5" fill="#000" opacity=".22" filter="url(#bl)"/><path d="${P}" fill="#f4f4f4" stroke="#e0e0e0" stroke-width="2"/>`;
const CREASE="";
function front(kind){
  const c=`<g transform="translate(30 42) scale(.26)">${tooth(kind)}</g>`;
  return `<svg viewBox="0 0 200 290" xmlns="http://www.w3.org/2000/svg">${SHARED}${SHADOW}
<path d="${P}" transform="${IN}" fill="url(#fg)"/>${CREASE}
${c}<g transform="rotate(180 100 137)">${c}</g>
<g transform="translate(30 66) scale(1.4)">${tooth(kind)}</g>
${kind==='good'?`<g transform="translate(150 94)">${STAR}</g><g transform="translate(50 196) scale(.6)">${STAR}</g>`:''}</svg>`;
}
function back(){
  return `<svg viewBox="0 0 200 290" xmlns="http://www.w3.org/2000/svg">${SHARED}${SHADOW}
<path d="${P}" transform="${IN}" fill="url(#bg)"/><path d="${P}" transform="${IN}" fill="url(#bp)"/>${CREASE}
<circle cx="100" cy="140" r="40" fill="rgba(255,255,255,.92)"/>
<g transform="translate(72 112) scale(.56)"><path d="${T}" fill="#fff" stroke="#2b8fd0" stroke-width="5" stroke-linejoin="round"/></g></svg>`;
}

const stage=document.getElementById('stage'),msg=document.getElementById('msg'),sub=document.getElementById('sub'),sc=document.getElementById('score'),btns=document.getElementById('btns');
let cw,gap,ch,won=0,lost=0,phase='idle',level=0;
const cards=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const slotX=s=>s*(cw+gap);
for(let i=0;i<3;i++){
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`<div class="inner"><div class="face front">${front(i===0?'good':'bad')}</div><div class="face back">${back()}</div></div>`;
  stage.appendChild(el);
  cards.push({el,inner:el.firstChild,slot:i,good:i===0});
}
function place(c,x,y,s){c.el.style.transform=`translate(${x}px,${y}px) scale(${s||1})`}
function layout(){
  const W=stage.clientWidth;gap=W*0.03;cw=(W-2*gap)/3;ch=cw*1.45;
  stage.style.height=ch+'px';
  cards.forEach(c=>{c.el.style.width=cw+'px';c.el.style.height=ch+'px';place(c,slotX(c.slot),0)});
}
window.addEventListener('resize',()=>{if(phase!=='shuffling')layout()});
layout();

function swap(a,b,dur){
  return new Promise(res=>{
    const ax=slotX(a.slot),bx=slotX(b.slot),t0=performance.now(),lift=ch*0.16;
    a.el.style.zIndex=3;b.el.style.zIndex=2;
    (function step(now){
      const t=Math.min(1,(now-t0)/dur);
      const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,arc=Math.sin(Math.PI*t);
      place(a,ax+(bx-ax)*e,-lift*arc,1+.08*arc);
      place(b,bx+(ax-bx)*e,lift*arc*.8,1-.05*arc);
      if(t<1)requestAnimationFrame(step);
      else{const s=a.slot;a.slot=b.slot;b.slot=s;a.el.style.zIndex=b.el.style.zIndex=1;place(a,slotX(a.slot),0);place(b,slotX(b.slot),0);res()}
    })(t0);
  });
}
const atSlot=s=>cards.find(c=>c.slot===s);
async function shuffle(){
  const rounds=Math.min(16,7+level*2),dur=Math.max(170,430-level*45);
  let last='';
  for(let i=0;i<rounds;i++){
    let p,q,key;
    do{p=Math.floor(Math.random()*3);q=(p+1+Math.floor(Math.random()*2))%3;key=[p,q].sort().join()}while(key===last);
    last=key;
    await swap(atSlot(p),atSlot(q),dur);
  }
}
const flip=(c,down)=>c.inner.classList.toggle('down',down);
function setMsg(t,cls,s){msg.textContent=t;msg.className=cls||'';sub.textContent=s||''}
function showBtns(list){
  btns.innerHTML='';
  list.forEach(([label,fn,alt])=>{
    const b=document.createElement('button');b.className='btn'+(alt?' alt':'');b.textContent=label;
    b.onclick=()=>{btns.innerHTML='';fn()};btns.appendChild(b);
  });
}
const updScore=()=>sc.textContent=`Menang = ${won} | Kalah = ${lost}`;

async function start(){
  phase='shuffling';
  setMsg('Perhatikan gigi sehat','','Level '+(level+1));
  await sleep(900);
  cards.forEach(c=>flip(c,true));
  await sleep(650);
  setMsg('Mengocok...','','Level '+(level+1));
  await shuffle();
  phase='pick';
  setMsg('Pilih kartu gigi sehat!');
}
function toStart(){
  level=0;phase='idle';
  setMsg('Temukan gigi sehat','','Kecepatan kembali ke level 1');
  showBtns([['Mulai',start]]);
}
async function pick(c){
  phase='result';
  flip(c,false);
  await sleep(550);
  cards.forEach(x=>{if(x!==c)flip(x,false)});
  if(c.good){won++;level=Math.min(level+1,8);setMsg('Benar!','ok','Berikutnya level '+(level+1));showBtns([['Lanjutkan main',start]])}
  else{lost++;setMsg('Salah!','bad','Kecepatan saat ini: level '+(level+1));showBtns([['Lanjutkan main',start],['Kembali ke Awal',toStart,1]])}
  updScore();
}
stage.addEventListener('click',e=>{
  const el=e.target.closest('.card');
  if(phase==='pick'&&el)pick(cards.find(c=>c.el===el));
});
showBtns([['Mulai',start]]);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tebak Istilah Gigi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8f2f0; --panel:#ffffff; --ink:#10303a; --muted:#5b7780;
  --mint:#1f9d85; --gum:#d9566f; --danger:#d92d20; --line:#c7dad6;
  --g:0px;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0d2128;--panel:#13303a;--ink:#e6f3f0;--muted:#8fb0b8;--mint:#3cc6aa;--gum:#ee7a90;--danger:#ff6b5e;--line:#27505a}
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:auto}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;line-height:1.45;padding:16px}
.game{max-width:520px;margin:0 auto}
h1{font-size:1.35rem;margin:0 0 2px;letter-spacing:-.01em}
.sub{margin:0 0 14px;color:var(--muted);font-size:.9rem}
.stats{display:flex;gap:16px;font-size:.9rem;color:var(--muted);margin-bottom:10px}
.stats b{color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.teeth{display:flex;justify-content:center;gap:6px;margin:4px 0 12px}
.tooth{display:block;width:min(44px,11vw);aspect-ratio:132/168;background:var(--toothimg) center/contain no-repeat;filter:drop-shadow(0 2px 2px rgba(16,48,58,.28))}
.tooth.lost{opacity:.2;filter:none}
.teeth.danger .tooth:not(.lost){filter:drop-shadow(1.5px 0 0 var(--danger)) drop-shadow(-1.5px 0 0 var(--danger)) drop-shadow(0 1.5px 0 var(--danger)) drop-shadow(0 -1.5px 0 var(--danger))}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:16px 0 8px;min-height:48px}
.slot{width:clamp(22px,7.2vw,34px);height:44px;border-bottom:3px solid var(--ink);display:flex;align-items:flex-end;justify-content:center;font-size:1.5rem;font-weight:800;padding-bottom:2px}
.slot.miss{color:var(--gum);border-color:var(--gum)}
.msg{min-height:3.2em;text-align:center;font-size:.95rem;margin:6px 0 10px}
.msg strong{display:block;font-size:1.05rem}

.keys{display:flex;flex-direction:column;gap:var(--g);max-width:340px;margin:0 auto;background:transparent}
.row{display:flex;justify-content:center;gap:var(--g)}
.key{
  position:relative;isolation:isolate;flex:none;
  width:calc((100% - 5 * var(--g)) / 6);aspect-ratio:193/194;padding:0;
  display:flex;align-items:center;justify-content:center;
  font:inherit;font-weight:800;font-size:1.25rem;color:#000;
  border:0;background:transparent var(--keyimg) center/100% 100% no-repeat;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.key::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:multiply;background:transparent;
  -webkit-mask:var(--keyimg) center/100% 100% no-repeat;mask:var(--keyimg) center/100% 100% no-repeat;
}
.key.ok::after{background:#5fd3b5}
.key.no::after{background:#f27d92}
.key.no{text-decoration:line-through}
.key:active:not(:disabled):not(.dead){filter:brightness(.93)}
.key:disabled{cursor:default;color:#000}
.key:disabled:not(.ok):not(.no){opacity:.6}
.key.dead{opacity:.4;cursor:default;font-size:.7rem;font-weight:700;pointer-events:none}

.actions{display:flex;gap:8px;margin-top:16px}
.actions[hidden]{display:none}
.btn{flex:1;font:inherit;font-weight:800;padding:12px 14px;border-radius:12px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn[hidden]{display:none}
:focus-visible{outline:3px solid var(--gum);outline-offset:2px}
</style>
</head>
<body>
<main class="game">
  <h1>Tebak Istilah Gigi</h1>
  <p class="sub">Salah menebak, satu gigi memudar. Enam gigi habis, ronde berakhir.</p>

  <div class="stats" aria-live="polite">
    <span>Beruntun: <b id="streak">0</b></span>
    <span>Benar: <b id="solved">0</b></span>
    <span>Kata: <b id="len">-</b> huruf</span>
  </div>

  <section class="card">
    <div class="teeth" id="teeth" role="img" aria-label="Sisa gigi"></div>
    <div class="word" id="word" aria-label="Kata yang ditebak"></div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="keys" id="keys"></div>
    <div class="actions" id="actions" hidden>
      <button class="btn primary" id="next">Kata berikutnya</button>
      <button class="btn" id="share">Bagikan</button>
    </div>
  </section>
</main>

<script src="assets/games/wordle.js"></script>
<script>
(function(){
  // Daftar kata ada di kata.js. Hanya kata A-Z, 4-12 huruf yang dipakai.
  var WORDS=(window.KATA_GIGI||[]).filter(function(w){return /^[A-Z]{4,12}$/.test(w)});

  var MAX=6, ALPHA="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  var TOOTH='<span class="tooth" aria-hidden="true"></span>';

  var $=function(id){return document.getElementById(id)};
  var queue=[], cur, guessed, wrong, over, lastWin, streak=0, solved=0;

  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

  function mkKey(l){
    var b=document.createElement("button");
    b.className="key"; b.textContent=l; b.dataset.l=l;
    b.setAttribute("aria-label","Huruf "+l);
    b.addEventListener("click",function(){guess(l)});
    return b;
  }
  function mkDead(label){
    var d=document.createElement("div");
    d.className="key dead"; d.textContent=label; d.setAttribute("aria-hidden","true");
    return d;
  }
  function build(){
    $("teeth").innerHTML=new Array(MAX+1).join(TOOTH);
    var k=$("keys"); k.innerHTML="";
    function addRow(items){
      var row=document.createElement("div"); row.className="row";
      items.forEach(function(x){row.appendChild(x)});
      k.appendChild(row);
    }
    ["ABCDEF","GHIJKL","MNOPQR","STUVWX"].forEach(function(r){
      addRow(r.split("").map(mkKey));
    });
    addRow([mkDead("Ctrl"),mkDead("Shift"),mkKey("Y"),mkKey("Z"),mkDead("Shift"),mkDead("Ctrl")]);
  }

  function start(){
    if(!WORDS.length){$("msg").textContent="Daftar kata kosong. Periksa file kata.js.";return}
    if(!queue.length) queue=shuffle(WORDS.slice());
    cur=queue.pop(); guessed={}; wrong=0; over=false;
    $("len").textContent=cur.length;
    $("msg").textContent="Pilih huruf untuk memulai.";
    $("actions").hidden=true;
    Array.prototype.forEach.call(document.querySelectorAll(".key:not(.dead)"),function(b){b.className="key";b.disabled=false});
    draw();
  }

  function draw(){
    var w=$("word"); w.innerHTML="";
    cur.split("").forEach(function(c){
      var s=document.createElement("div"); s.className="slot";
      if(guessed[c]) s.textContent=c;
      else if(over){s.textContent=c; s.className="slot miss"}
      w.appendChild(s);
    });
    var t=document.querySelectorAll("#teeth .tooth");
    for(var i=0;i<t.length;i++) t[i].classList.toggle("lost",i<wrong);
    $("teeth").classList.toggle("danger",MAX-wrong<=2);
    $("streak").textContent=streak; $("solved").textContent=solved;
  }

  function won(){return cur.split("").every(function(c){return guessed[c]})}

  function finish(win){
    over=true; lastWin=win;
    if(win){streak++;solved++}else streak=0;
    Array.prototype.forEach.call(document.querySelectorAll(".key:not(.dead)"),function(b){b.disabled=true});
    $("msg").innerHTML=win?"<strong>Benar!</strong>":"<strong>Gigi habis.</strong>Jawabannya: "+cur;
    $("actions").hidden=false;
    draw(); $("next").focus();
  }

  function guess(l){
    if(over||guessed[l]) return;
    guessed[l]=true;
    var key=document.querySelector('.key[data-l="'+l+'"]');
    key.disabled=true;
    if(cur.indexOf(l)>-1){
      key.classList.add("ok");
      draw();
      if(won()) finish(true);
    }else{
      key.classList.add("no"); wrong++;
      draw();
      if(wrong>=MAX) finish(false);
      else $("msg").textContent="Salah. Sisa gigi: "+(MAX-wrong)+".";
    }
  }

  // Bagikan: tidak membocorkan kata
  function shareText(){
    var left="",i;
    for(i=0;i<MAX;i++) left+=i<MAX-wrong?"\uD83E\uDDB7":"\u2B1C";
    return "Tebak Istilah Gigi\n"+left+"\n"+
      (lastWin?"Berhasil menebak":"Gagal menebak")+" kata "+cur.length+" huruf\n"+
      "Beruntun: "+streak+" | Total benar: "+solved+"\n"+location.href;
  }
  function copyText(t){
    function fallback(){window.prompt("Salin hasil:",t)}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){
        var b=$("share"),old=b.textContent;
        b.textContent="Tersalin!";
        setTimeout(function(){b.textContent=old},1500);
      },fallback);
    }else fallback();
  }
  function share(){
    if(!over) return;
    var t=shareText();
    if(navigator.share){
      navigator.share({text:t}).catch(function(e){if(!e||e.name!=="AbortError") copyText(t)});
    }else copyText(t);
  }

  document.addEventListener("keydown",function(e){
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    var l=e.key.length===1?e.key.toUpperCase():"";
    if(l && ALPHA.indexOf(l)>-1) guess(l);
    else if(e.key==="Enter"&&over&&document.activeElement.id!=="share") start();
  });
  $("next").addEventListener("click",start);
  $("share").addEventListener("click",share);

  build(); start();
})();
</script>
</body>
</html>

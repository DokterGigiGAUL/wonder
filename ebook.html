<!DOCTYPE html>
<html lang="id">
    
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ebook</title>  
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/ebook.css">
</head>

<body>
<header class="ebook-header">
    <button class="ebook-back-btn" onclick="history.back()">
        <img src="https://img.icons8.com/?size=16&id=bb5otgOrCxAR&format=png&color=FFFFFF">
    </button>
    <div class="ebook-title-box">
        <h2 id="ebook-judul">Ebook Gigital</h2>
    </div>
</header>

<main class="container">
    <section class="ebook-preview">
        <div id="preview-slider" class="preview-slider"></div>
        <div id="preview-dots" class="preview-dots"></div>
    </section>
    
    <section class="ebook-info">
        <h2 id="ebook-title"></h2>
        <p id="ebook-price" class="ebook-price"></p>
        <div class="ebook-action">
            <a id="sampleButton" class="btn btn-outline sample-btn">
                Sample
            </a>
            <a id="buyButton" class="btn btn-primary iframe-lightbox-link">
                Beli Sekarang
            </a>
        </div>
    </section>
    
    <section class="ebook-description">
        <h3>Deskripsi</h3>
        <p id="ebook-description"></p>
        <div class="ebook-consent">
            DISCLAIMER: Produk ini merupakan ebook. Setelah pembayaran berhasil Anda akan menerima file digital, bukan buku fisik.
        </div>
    </section>
    
    <section class="ebook-meta">
        <h3>Informasi</h3>
        <p id="ebook-pages"></p>
        <p id="ebook-release"></p>
    </section>
    
    <section class="ebook-payment">
        <h3>Metode Pembayaran</h3>
        <img
            src="assets/images/metode-bayar.jpg
            alt="Metode Pembayaran">
    </section>
</main>

<script src="js/ebook-data.js"></script>
<script src="js/ebook.js"></script>
<script src="https://mayarembed.r2.mayar.id/mayar-new-min.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katalog Konten Wonder App</title>
    <link rel="icon" href="assets/images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="assets/images/favicon-32x32.png">
    <!--<link rel="apple-touch-icon" href="/apple-touch-icon.png">-->
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/explore.css" />

  </head>

  <body>
    <header class="explore-header">
      <button class="explore-back-btn" onclick="history.back()"><img src="https://img.icons8.com/?size=16&id=bb5otgOrCxAR&format=png&color=FFFFFF"></button>

      <h1 id="pageTitle">Semua Kuis</h1>
      <div class="header-actions"> 
      <button onclick="openLogin()" id="loginBtn" class="btn btn-secondary" type="button"> Login </button> 
      <button onclick="logout()" id="logoutBtn" class="btn btn-secondary" type="button" style="display:none;"> Logout </button> 
    </div> 
    </header>

    <main class="container-explore">
      <div class="explore-tabs">
        <button id="quizTab" class="tab-btn">Kuis</button>
        <button id="ttsTab" class="tab-btn">TTS</button>
        <button id="caseTab" class="tab-btn">Kasus</button>
        <button id="comicTab" class="tab-btn">Komik</button>
        <!--<button id="ebookTab" class="tab-btn">Ebook</button>-->
      </div>

      <section id="quiz-list" class="card-grid"></section>
      <section id="tts-container" class="tts-grid"></section>
      <section id="case-container" class="card-grid"></section>
      <section id="comics-container" class="card-grid"></section>
      <!--<section id="ebook-container" class="card-grid"></section>-->
    </main>

    <!-- TEMPLATE CARD -->

<template id="list-card-template">
    <article class="list-card">
<div class="explore-badge-overlay">
    <div class="featured-badge explore-badge"></div>
</div>
        <img
            class="list-thumb"
            alt="">
        <div class="list-detail">
            <h3 class="list-title"></h3>
            <p class="list-description"></p>
              <div class="list-info">
                <div class="list-price"></div>
                <button class="btn btn-outline list-btn" type="button"></button>
              </div>
        </div> 
             <!-- <div class="list-info">
            <h3 class="list-title"></h3>
            <p class="list-description"></p>
   
            <button class="btn btn-outline list-btn" type="button"></button>
              </div>-->
    </article>

</template>
    
<!-- Login Modal -->
<div id="loginModal" class="login-modal">
    <div class="login-box">
        <button type="button" class="login-close" onclick="closeLogin()" aria-label="Tutup">&times;</button>
        <h2>Login</h2>
        <input id="loginEmail" type="email" placeholder="Email" required>
        <input id="loginPassword" type="password" placeholder="Password" required>
        <button type="button" class="btn btn-primary login-email" onclick="loginEmail()">Login</button>
        <button type="button" class="btn btn-outline register-email" onclick="registerEmail()">Daftar</button>
        <div class="divider">ATAU</div>
        <button type="button" class="btn btn-primary login-google" onclick="loginGoogle()">Login / Daftar dengan Google</button>
    </div>
</div>
    
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
    
    <script src="js/premium.js"></script>
    <script src="js/api.js"></script>

    <script src="js/auth.js"></script>
    <script src="js/purchase-manager.js"></script>    
    <script src="js/storage.js"></script>
    <script src="js/quiz-data.js"></script>
    <script src="js/comics-data.js"></script>
    <script src="js/tts-data.js"></script>
    <script src="js/case-data.js"></script>
    <!--<script src="js/ebook-data.js"></script>-->

    <script src="js/explore.js"></script>
    <script src="https://mayarembed.r2.mayar.id/mayar-new-min.js"></script>
    
  </body>
</html>

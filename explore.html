<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katalog Konten Wonder App</title>
    <link rel="icon" href="assets/images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="assets/images/favicon-32x32.png">
    <!--<link rel="apple-touch-icon" href="/apple-touch-icon.png">-->
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/explore.css" />

  </head>

  <body>
    <header class="explore-header">
      <button class="explore-back-btn" onclick="window.location.href='index.html'">
        <img src="https://img.icons8.com/?size=16&id=bb5otgOrCxAR&format=png&color=FFFFFF">
      </button>

      <h1 id="pageTitle">Semua Kuis</h1>
    </header>

    <main class="container-explore">
      <div class="search-bar-wrap">
        <form id="siteSearchForm" class="search-bar" role="search">
          <input type="search" id="siteSearchInput" name="q" class="search-input" placeholder="Cari kuis, TTS, kasus, komik..." aria-label="Cari konten">
          <button type="submit" class="search-btn">Cari</button>
        </form>
      </div>

      <div class="explore-tabs">
        <button id="quizTab" class="tab-btn">Kuis</button>
        <button id="ttsTab" class="tab-btn">TTS</button>
        <button id="caseTab" class="tab-btn">Kasus</button>
        <button id="comicTab" class="tab-btn">Komik</button>
        <!--<button id="ebookTab" class="tab-btn">Ebook</button>-->
      </div>

      <section id="quiz-list" class="card-grid"></section>
      <section id="tts-container" class="tts-grid"></section>
      <section id="case-container" class="card-grid"></section>
      <section id="comics-container" class="card-grid"></section>
      <!--<section id="ebook-container" class="card-grid"></section>-->

      <section id="search-results" class="search-results">
        <p id="search-empty" class="search-empty"></p>

        <div id="search-quiz-group" class="search-group">
          <h2 class="search-group-title">Kuis</h2>
          <div id="search-quiz-list" class="card-grid"></div>
        </div>

        <div id="search-tts-group" class="search-group">
          <h2 class="search-group-title">TTS</h2>
          <div id="search-tts-list" class="card-grid"></div>
        </div>

        <div id="search-case-group" class="search-group">
          <h2 class="search-group-title">Kasus</h2>
          <div id="search-case-list" class="card-grid"></div>
        </div>

        <div id="search-comic-group" class="search-group">
          <h2 class="search-group-title">Komik</h2>
          <div id="search-comic-list" class="card-grid"></div>
        </div>
      </section>
    </main>

    <!-- TEMPLATE CARD -->

<template id="list-card-template">
    <article class="list-card">
<div class="explore-badge-overlay">
    <div class="featured-badge explore-badge"></div>
</div>
        <img
            class="list-thumb"
            alt="">
        <div class="list-detail">
            <h3 class="list-title"></h3>
            <p class="list-description"></p>
              <div class="list-info">
                <div class="list-price"></div>
                <button class="btn btn-outline list-btn" type="button"></button>
              </div>
        </div> 
             <!-- <div class="list-info">
            <h3 class="list-title"></h3>
            <p class="list-description"></p>
   
            <button class="btn btn-outline list-btn" type="button"></button>
              </div>-->
    </article>

</template>

    <script src="js/storage.js"></script>
    <script src="js/quiz-data.js"></script>
    <script src="js/comic-data.js"></script>
    <script src="js/tts-data.js"></script>
    <script src="js/case-data.js"></script>

    <script src="js/search.js"></script>
    <script src="js/explore.js"></script>
    
  </body>
</html>
